<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Results &middot; Fletcher's CFB Predictions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <span class="nav-brand">Fletcher's <span class="accent">CFB</span> Predictions</span>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Predictor</a>
      <a href="rankings.html" class="nav-link">Rankings</a>
      <a href="weekly.html" class="nav-link active">Weekly Results</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <h1 class="page-title">Weekly Results</h1>

  <section class="panel">
    <div class="field-group" style="margin-bottom:20px; max-width:220px;">
      <label for="weekSelect">Select Week</label>
      <select id="weekSelect"><option>Loading...</option></select>
    </div>
    <div class="stat-strip" id="weekSummaryStrip" style="margin-bottom:18px;"></div>
    <div id="weekResultsContainer">
      <div class="empty-state">Select a week to see predicted vs. actual results.</div>
    </div>
  </section>

  <footer>Built by Fletcher &middot; updates automatically from live season data</footer>
</div>

<script src="common.js"></script>
<script>
(function () {
  function scoreLine(label, home, away) {
    return "<div class='score-line'><span class='score-line-label'>" + label + "</span> " +
      home + " &ndash; " + away + "</div>";
  }

  function statLine(label, value) {
    return "<div class='score-line'><span class='score-line-label'>" + label + "</span> " + value + "</div>";
  }

  function renderWeekSummary(games) {
    const graded = games.filter(function (g) { return g.graded; });
    const el = document.getElementById("weekSummaryStrip");
    if (graded.length === 0) {
      el.innerHTML = "";
      return;
    }
    const wins = graded.filter(function (g) {
      return (g.predicted_spread > 0) === ((g.actual_home_score - g.actual_away_score) > 0);
    }).length;
    const atsGames = graded.filter(function (g) { return g.ats_correct !== null && g.ats_correct !== undefined; });
    const atsWins = atsGames.filter(function (g) { return g.ats_correct; }).length;
    const ouGames = graded.filter(function (g) { return g.ou_correct !== null && g.ou_correct !== undefined; });
    const ouWins = ouGames.filter(function (g) { return g.ou_correct; }).length;

    let html = '<div class="stat-item"><span class="stat-label">Win Acc.</span><span class="stat-value">' +
      wins + '/' + graded.length + '</span></div>';
    if (atsGames.length > 0) {
      html += '<div class="stat-item"><span class="stat-label">ATS</span><span class="stat-value">' +
        atsWins + '/' + atsGames.length + '</span></div>';
    }
    if (ouGames.length > 0) {
      html += '<div class="stat-item"><span class="stat-label">O/U</span><span class="stat-value">' +
        ouWins + '/' + ouGames.length + '</span></div>';
    }
    el.innerHTML = html;
  }

  function resultBadge(correct) {
    if (correct === null || correct === undefined) return "<span class='result-badge pending'>&mdash;</span>";
    return correct ? "<span class='result-badge correct'>Yes</span>" : "<span class='result-badge incorrect'>No</span>";
  }

  async function loadWeekResults(week) {
    const container = document.getElementById("weekResultsContainer");
    container.innerHTML = '<div class="empty-state">Loading week ' + week + '...</div>';
    try {
      const snap = await loadJSON("history/week_" + week + ".json");
      if (!snap.games || snap.games.length === 0) {
        container.innerHTML = '<div class="empty-state">No games found for this week.</div>';
        document.getElementById("weekSummaryStrip").innerHTML = "";
        return;
      }
      renderWeekSummary(snap.games);

      let html = "<table><thead><tr>" +
        "<th>Matchup</th><th>Score</th><th>Win</th><th>ATS</th><th>O/U</th>" +
        "</tr></thead><tbody>";
      snap.games.forEach(function (g) {
        let scoreCell = scoreLine("Pred", g.predicted_home_score.toFixed(1), g.predicted_away_score.toFixed(1));
        let winBadge = "<span class='result-badge pending'>&mdash;</span>";

        const hasVegasSpread = g.vegas_spread !== null && g.vegas_spread !== undefined;
        const hasVegasTotal = g.vegas_total !== null && g.vegas_total !== undefined;

        let atsCell = statLine("Pred", fmtSigned(g.predicted_spread)) +
          statLine("Vegas", hasVegasSpread ? fmtSigned(g.vegas_spread) : "N/A");
        let ouCell = statLine("Pred", g.predicted_total.toFixed(1)) +
          statLine("Vegas", hasVegasTotal ? g.vegas_total.toFixed(1) : "N/A");

        let atsBadge = "<span class='result-badge pending'>&mdash;</span>";
        let ouBadge = "<span class='result-badge pending'>&mdash;</span>";

        if (g.graded) {
          scoreCell += scoreLine("Actual", g.actual_home_score, g.actual_away_score);
          const actualMargin = g.actual_home_score - g.actual_away_score;
          winBadge = resultBadge((g.predicted_spread > 0) === (actualMargin > 0));
          atsBadge = resultBadge(g.ats_correct);
          ouBadge = resultBadge(g.ou_correct);
        }

        atsCell += "<div class='badge-row'>" + atsBadge + "</div>";
        ouCell += "<div class='badge-row'>" + ouBadge + "</div>";

        html += "<tr><td class='team-cell'>" + g.home + "<br><span class='vs-text'>vs " + g.away + "</span></td>" +
          "<td>" + scoreCell + "</td><td>" + winBadge + "</td><td>" + atsCell + "</td><td>" + ouCell + "</td></tr>";
      });
      html += "</tbody></table>";
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = '<div class="error-state">Could not load week ' + week + ': ' + err.message + '</div>';
      document.getElementById("weekSummaryStrip").innerHTML = "";
    }
  }

  async function populateWeekSelect(availableWeeks) {
    const sel = document.getElementById("weekSelect");
    sel.innerHTML = "";
    if (!availableWeeks || availableWeeks.length === 0) {
      sel.innerHTML = '<option>No weeks available yet</option>';
      document.getElementById("weekResultsContainer").innerHTML =
        '<div class="empty-state">No weekly snapshots yet -- check back once the season starts.</div>';
      return;
    }
    availableWeeks.slice().reverse().forEach(function (w) {
      const opt = document.createElement("option");
      opt.value = w;
      opt.textContent = "Week " + w;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () { loadWeekResults(sel.value); });
    loadWeekResults(sel.value);
  }

  async function init() {
    try {
      const availableWeeks = await loadJSON("history/weeks_available.json").catch(function () { return []; });
      populateWeekSelect(availableWeeks);
    } catch (err) {
      document.getElementById("weekResultsContainer").innerHTML =
        '<div class="error-state">Could not load data: ' + err.message + '</div>';
      console.error(err);
    }
  }
  init();
})();
</script>
</body>
</html>
