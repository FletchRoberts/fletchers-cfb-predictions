<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fletcher's CFB Predictions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <span class="nav-brand">Fletcher's <span class="accent">CFB</span> Predictions</span>
    <div class="nav-links">
      <a href="index.html" class="nav-link active">Predictor</a>
      <a href="rankings.html" class="nav-link">Rankings</a>
      <a href="weekly.html" class="nav-link">Weekly Results</a>
    </div>
  </div>
</nav>

<div class="wrap">

  <header>
    <h1>Model-Based <span>Spread</span> &amp; Total Projections</h1>
    <div class="updated-badge" id="updatedBadge">loading...</div>
  </header>

  <section class="panel">
    <h2 class="panel-title">Matchup Predictor</h2>
    <div class="matchup-picker">
      <div class="field-group">
        <label for="homeSelect">Home</label>
        <select id="homeSelect"></select>
      </div>
      <div class="vs-mark">VS</div>
      <div class="field-group">
        <label for="awaySelect">Away</label>
        <select id="awaySelect"></select>
      </div>
    </div>
    <button id="predictBtn" class="primary-btn">Predict Matchup</button>

    <div class="scoreboard" id="scoreboard">
      <div class="score-row">
        <span class="team-name" id="homeNameOut"></span>
        <span class="fav-tag" id="homeFavTag" style="visibility:hidden;">FAVORITE</span>
        <span class="score-num" id="homeScoreOut"></span>
      </div>
      <div class="score-row">
        <span class="team-name" id="awayNameOut"></span>
        <span class="fav-tag" id="awayFavTag" style="visibility:hidden;">FAVORITE</span>
        <span class="score-num" id="awayScoreOut"></span>
      </div>
      <hr class="divider-line">
      <div class="stat-strip">
        <div class="stat-item">
          <span class="stat-label">Spread</span>
          <span class="stat-value" id="spreadOut"></span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="totalOut"></span>
        </div>
      </div>
    </div>
    <div class="error-state" id="matchupError" style="display:none;"></div>
  </section>

  <section class="panel" id="accuracyPanel">
    <h2 class="panel-title">Season Accuracy</h2>
    <div class="stat-strip" id="accuracyStrip">
      <div class="empty-state">Loading...</div>
    </div>
  </section>

  <footer>Built by Fletcher &middot; updates automatically from live season data</footer>
</div>

<script src="common.js"></script>
<script>
(function () {
  const state = { predictions: null, teams: null };

  function populateTeamSelects(teams) {
    const homeSel = document.getElementById("homeSelect");
    const awaySel = document.getElementById("awaySelect");
    homeSel.innerHTML = "";
    awaySel.innerHTML = "";
    teams.forEach(function (t) {
      const optH = document.createElement("option");
      optH.value = t; optH.textContent = t;
      homeSel.appendChild(optH);
      const optA = document.createElement("option");
      optA.value = t; optA.textContent = t;
      awaySel.appendChild(optA);
    });
    if (teams.length > 1) {
      homeSel.selectedIndex = 0;
      awaySel.selectedIndex = 1;
    }
  }

  function renderPrediction(home, away) {
    const errorEl = document.getElementById("matchupError");
    const boardEl = document.getElementById("scoreboard");
    errorEl.style.display = "none";
    boardEl.classList.remove("visible");

    if (home === away) {
      errorEl.textContent = "Home and Away must be different teams.";
      errorEl.style.display = "block";
      return;
    }

    const key = home + "|" + away;
    const pred = state.predictions[key];
    if (!pred) {
      errorEl.textContent = "No prediction available for " + home + " vs " + away + ".";
      errorEl.style.display = "block";
      return;
    }

    document.getElementById("homeNameOut").textContent = pred.home;
    document.getElementById("awayNameOut").textContent = pred.away;
    document.getElementById("homeScoreOut").textContent = pred.predicted_home_score.toFixed(1);
    document.getElementById("awayScoreOut").textContent = pred.predicted_away_score.toFixed(1);

    const homeFav = pred.favorite === pred.home;
    document.getElementById("homeNameOut").classList.toggle("favorite", homeFav);
    document.getElementById("awayNameOut").classList.toggle("favorite", !homeFav);
    document.getElementById("homeFavTag").style.visibility = homeFav ? "visible" : "hidden";
    document.getElementById("awayFavTag").style.visibility = !homeFav ? "visible" : "hidden";
    document.getElementById("homeScoreOut").classList.toggle("circled", homeFav);
    document.getElementById("awayScoreOut").classList.toggle("circled", !homeFav);

    const spreadFavName = pred.favorite;
    const spreadMag = Math.abs(pred.predicted_spread).toFixed(1);
    document.getElementById("spreadOut").textContent = spreadFavName + " -" + spreadMag;
    document.getElementById("totalOut").textContent = pred.predicted_total.toFixed(1);

    boardEl.classList.add("visible");
  }

  function renderAccuracySummary(summary) {
    const el = document.getElementById("accuracyStrip");
    if (!summary || summary.games_graded === 0) {
      el.innerHTML = '<div class="empty-state">No games graded yet -- check back once the season starts.</div>';
      return;
    }
    el.innerHTML =
      '<div class="stat-item"><span class="stat-label">Games Graded</span><span class="stat-value">' + summary.games_graded + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">Win Accuracy</span><span class="stat-value">' + summary.win_accuracy_pct + '%</span></div>' +
      '<div class="stat-item"><span class="stat-label">Avg Margin Error</span><span class="stat-value">' + summary.avg_margin_error + '</span></div>' +
      '<div class="stat-item"><span class="stat-label">Avg Total Error</span><span class="stat-value">' + summary.avg_total_error + '</span></div>';
  }

  async function init() {
    try {
      const [predictions, teams, lastUpdated, summary] = await Promise.all([
        loadJSON("predictions.json"),
        loadJSON("teams.json"),
        loadJSON("last_updated.json"),
        loadJSON("history/summary.json").catch(function () { return null; })
      ]);

      state.predictions = predictions;
      state.teams = teams;

      populateTeamSelects(teams);
      renderUpdatedBadge("updatedBadge", lastUpdated);
      renderAccuracySummary(summary);

      document.getElementById("predictBtn").disabled = false;
      document.getElementById("predictBtn").addEventListener("click", function () {
        const home = document.getElementById("homeSelect").value;
        const away = document.getElementById("awaySelect").value;
        renderPrediction(home, away);
      });
    } catch (err) {
      document.getElementById("updatedBadge").textContent = "DATA UNAVAILABLE";
      document.getElementById("accuracyStrip").innerHTML =
        '<div class="error-state">Could not load data: ' + err.message + '</div>';
      console.error(err);
    }
  }

  document.getElementById("predictBtn").disabled = true;
  init();
})();
</script>
</body>
</html>
