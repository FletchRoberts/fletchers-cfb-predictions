name: Deploy Site to GitHub Pages

# Two ways this runs, on purpose:
# 1. on: push -- for manual edits you make directly (this already worked correctly).
# 2. on: schedule -- a backup specifically for update.yml's daily bot commit, since
#    GitHub does NOT let a GITHUB_TOKEN-authored commit trigger other workflows
#    (including this one) via push, even though it's configured to listen for
#    pushes. Scheduling this an hour after update.yml's 8:00 UTC run sidesteps
#    that limitation entirely, rather than needing a PAT to work around it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
